name: Release

# A tag vX.Y.Z releases Inky for macOS and Windows. The macos job builds Inky.app
# for Apple silicon with `make release`, signs it with the team's Developer ID
# and has Apple notarize it. The windows job builds the installer (not code
# signed yet) and tries it on the runner (scripts/smoke-windows.mjs). When both
# are done, the publish job puts both on the download host with one feed that
# the app's updater reads (plugins.updater in src-tauri/tauri.conf.json). An
# installed app finds the new version at its next check and offers it.
#
# The version is the tag's X.Y.Z. tauri.conf.json is not changed.
# docs/ops/desktop-release.md lists the variables, the secrets and the steps.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
  DOWNLOAD_BASE: ${{ vars.DOWNLOAD_BASE }}
  # s3://<bucket>[/<prefix>]: the place that DOWNLOAD_BASE serves.
  DOWNLOAD_BUCKET: ${{ vars.DOWNLOAD_BUCKET }}

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          # All of main's history: the next step checks that the tag is on main.
          fetch-depth: 0

      - name: Version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::The tag $GITHUB_REF_NAME is not vX.Y.Z."
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::The tag $GITHUB_REF_NAME is not on main. Releases come from main only."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Inky $version"

  macos:
    needs: version
    # An Apple silicon host, named so that a move to a new macOS shows in review.
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Settings are set
        env:
          DOWNLOAD_S3_ENDPOINT: ${{ vars.DOWNLOAD_S3_ENDPOINT }}
          DOWNLOAD_S3_REGION: ${{ vars.DOWNLOAD_S3_REGION }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          DOWNLOAD_S3_ACCESS_KEY_ID: ${{ secrets.DOWNLOAD_S3_ACCESS_KEY_ID }}
          DOWNLOAD_S3_SECRET_ACCESS_KEY: ${{ secrets.DOWNLOAD_S3_SECRET_ACCESS_KEY }}
        run: |
          missing=0
          require() {
            kind=$1; shift
            for name in "$@"; do
              if [ -z "${!name}" ]; then
                echo "::error::The $kind $name is not set (docs/ops/desktop-release.md)."
                missing=1
              fi
            done
          }
          require variable APPLE_TEAM_ID DOWNLOAD_BASE DOWNLOAD_BUCKET \
            DOWNLOAD_S3_ENDPOINT DOWNLOAD_S3_REGION
          require secret APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD TAURI_SIGNING_PRIVATE_KEY \
            DOWNLOAD_S3_ACCESS_KEY_ID DOWNLOAD_S3_SECRET_ACCESS_KEY
          # Notarization: an App Store Connect API key, or else an Apple ID.
          if [ -n "$APPLE_API_KEY$APPLE_API_ISSUER$APPLE_API_PRIVATE_KEY" ] || [ -z "$APPLE_ID" ]; then
            require secret APPLE_API_KEY APPLE_API_ISSUER APPLE_API_PRIVATE_KEY
          else
            require secret APPLE_ID APPLE_PASSWORD
          fi
          if [[ "$DOWNLOAD_BASE" != https://* ]]; then
            echo "::error::DOWNLOAD_BASE must be an https URL."
            missing=1
          fi
          if ! [[ "$DOWNLOAD_BUCKET" =~ ^s3://[^/]+(/[^/]+)*$ ]]; then
            echo "::error::DOWNLOAD_BUCKET must be s3://<bucket>[/<prefix>] without a trailing slash."
            missing=1
          fi
          exit $missing

      - name: Signing certificate
        id: certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -base64 24)
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm "$RUNNER_TEMP/certificate.p12"
          # Only the team's Developer ID signs Inky.
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | grep -o "\"Developer ID Application: .* ($APPLE_TEAM_ID)\"" | head -1 | tr -d '"')
          if [ -z "$identity" ]; then
            echo "::error::APPLE_CERTIFICATE holds no Developer ID Application certificate for team $APPLE_TEAM_ID."
            security find-identity -v -p codesigning "$keychain"
            exit 1
          fi
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "Signing as $identity"

      # No caches: a cache saved by a tag's run is not visible to the next tag's run.
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile

      - name: Check and test
        run: |
          pnpm check
          pnpm test
          node --test scripts/release-updates.test.mjs

      - name: Build, sign and notarize
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
          APPLE_SIGNING_IDENTITY: ${{ steps.certificate.outputs.identity }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Tauri notarizes with the API key when it has one. The Apple ID
          # is then left out, so the two never mix.
          if [ -n "$APPLE_API_KEY" ]; then
            export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
            printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$APPLE_API_KEY_PATH"
            unset APPLE_ID APPLE_PASSWORD
          else
            unset APPLE_API_KEY APPLE_API_ISSUER
          fi
          unset APPLE_API_PRIVATE_KEY
          make release

      - name: Check the signature
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          bundle=src-tauri/target/release/bundle
          app=$bundle/macos/Inky.app
          codesign --verify --deep --strict --verbose=2 "$app"
          team=$(codesign -dv "$app" 2>&1 | sed -n 's/^TeamIdentifier=//p')
          if [ "$team" != "$APPLE_TEAM_ID" ]; then
            echo "::error::Inky.app is signed by team '$team', not $APPLE_TEAM_ID."
            exit 1
          fi
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"
          # The DMG and its staged copy: the copy is the file behind the download link.
          for dmg in "$bundle/dmg/Inky_${VERSION}_aarch64.dmg" src-tauri/target/release/upload/Inky.dmg; do
            codesign --verify --verbose=2 "$dmg"
            xcrun stapler validate "$dmg"
            spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          done

      # The publish job uploads them, with the Windows files, once both builds pass.
      - uses: actions/upload-artifact@v4
        with:
          name: upload-macos
          path: src-tauri/target/release/upload/
          if-no-files-found: error
          retention-days: 7

      - name: Remove the signing keychain and the keys
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8

  windows:
    needs: version
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile

      - name: Check and test
        run: |
          pnpm check
          pnpm test
          (cd src-tauri && cargo test)
          node --test scripts/release-updates.test.mjs

      # tauri.windows.conf.json makes the bundle a per-user NSIS installer.
      # It is not code signed yet: Windows SmartScreen warns on first run.
      - name: Build
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          pnpm tauri build \
            --config "{\"version\":\"$VERSION\"}" \
            --config "$(node scripts/release-updates.mjs config "$DOWNLOAD_BASE")"
          node scripts/release-updates.mjs stage "$DOWNLOAD_BASE" "$VERSION" \
            src-tauri/target/release/bundle src-tauri/target/release/upload src-tauri/tauri.conf.json

      - name: Install and run it
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: node scripts/smoke-windows.mjs "src-tauri/target/release/bundle/nsis/Inky_${VERSION}_x64-setup.exe"

      - name: Use it
        run: |
          cargo install tauri-driver --locked
          # The Edge driver that matches this machine's Edge (Tauri's advice).
          cargo install --git https://github.com/chippers/msedgedriver-tool --locked
          mkdir -p "$RUNNER_TEMP/edgedriver"
          (cd "$RUNNER_TEMP/edgedriver" && msedgedriver-tool)
          export PATH="$RUNNER_TEMP/edgedriver:$PATH"
          msedgedriver --version
          # The WebView2 runtime the app uses: its version should match the driver's.
          reg query 'HKLM\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' //v pv || true
          node e2e/windows.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: upload-windows
          path: src-tauri/target/release/upload/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [version, macos, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Both staged folders into one: the mirror of the download host.
      - uses: actions/download-artifact@v4
        with:
          pattern: upload-*
          merge-multiple: true
          path: upload

      - name: The feed covers both platforms
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          node scripts/release-updates.mjs feed "$DOWNLOAD_BASE" "$VERSION" upload
          for p in darwin-aarch64 windows-x86_64; do
            jq -e --arg p "$p" '.platforms[$p].signature' upload/app/latest.json > /dev/null \
              || { echo "::error::upload/app/latest.json has no $p"; exit 1; }
          done
          cat upload/app/latest.json

      # The version's files first, the feed last: an app never sees a
      # version whose files are not there yet.
      - name: Publish to the download host
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DOWNLOAD_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DOWNLOAD_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.DOWNLOAD_S3_REGION }}
          AWS_ENDPOINT_URL_S3: ${{ vars.DOWNLOAD_S3_ENDPOINT }}
          # Checksums only where S3 requires them: other S3 hosts refuse the new default.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          put() {
            aws s3 cp "upload/$1" "$DOWNLOAD_BUCKET/$1" --no-progress \
              --content-type "$2" --cache-control "$3"
          }
          immutable="public, max-age=31536000, immutable"
          latest="public, max-age=300"
          exe="Inky_${VERSION}_x64-setup.exe"
          put "app/$VERSION/Inky.app.tar.gz" application/gzip "$immutable"
          put "app/$VERSION/Inky_${VERSION}_aarch64.dmg" application/x-apple-diskimage "$immutable"
          put "app/$VERSION/$exe" application/vnd.microsoft.portable-executable "$immutable"
          # The links to give people: always the latest installers.
          put Inky.dmg application/x-apple-diskimage "$latest"
          put Inky-setup.exe application/vnd.microsoft.portable-executable "$latest"
          put app/latest.json application/json "no-cache"

      - name: The download host serves the new feed
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          served=$(curl -fsS "$DOWNLOAD_BASE/app/latest.json" | jq -r .version)
          if [ "$served" != "$VERSION" ]; then
            echo "::error::$DOWNLOAD_BASE/app/latest.json names version '$served', not $VERSION. Check DOWNLOAD_BASE against DOWNLOAD_BUCKET."
            exit 1
          fi
          curl -fsSI -o /dev/null "$DOWNLOAD_BASE/app/$VERSION/Inky.app.tar.gz"
          curl -fsSI -o /dev/null "$DOWNLOAD_BASE/app/$VERSION/Inky_${VERSION}_x64-setup.exe"
          curl -fsSI -o /dev/null "$DOWNLOAD_BASE/Inky.dmg"
          curl -fsSI -o /dev/null "$DOWNLOAD_BASE/Inky-setup.exe"

      # latest.json is on the GitHub release too: apps built before the download
      # host read their updates from the latest GitHub release. The feed points
      # them at the download host, and the version they install reads from there.
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          v=upload/app/$VERSION
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "Inky $VERSION" \
            --notes "Download: macOS $DOWNLOAD_BASE/app/$VERSION/Inky_${VERSION}_aarch64.dmg · Windows $DOWNLOAD_BASE/app/$VERSION/Inky_${VERSION}_x64-setup.exe" \
            --generate-notes \
            "$v/Inky_${VERSION}_aarch64.dmg" \
            "$v/Inky.app.tar.gz" \
            "$v/Inky.app.tar.gz.sig" \
            "$v/Inky_${VERSION}_x64-setup.exe" \
            "$v/Inky_${VERSION}_x64-setup.exe.sig" \
            upload/app/latest.json
